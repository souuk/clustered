<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dual-rail power-supply functional overview</title>
  <desc id="desc">A simplified flow diagram showing AC input, a 12.6 volt center-tapped transformer, positive and negative rectification and filtering branches, LM317 and LM337 regulators, and plus 15 volt, ground, and minus 15 volt outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #111; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; fill: #444; }
      .label { font: 700 24px Arial, Helvetica, sans-serif; fill: #111; }
      .body { font: 400 20px Arial, Helvetica, sans-serif; fill: #222; }
      .small { font: 400 17px Arial, Helvetica, sans-serif; fill: #444; }
      .box { fill: #f7f7f7; stroke: #222; stroke-width: 2.5; rx: 12; }
      .output { fill: #e9e9e9; stroke: #111; stroke-width: 3; rx: 12; }
      .line { fill: none; stroke: #222; stroke-width: 4; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #222; stroke-width: 4; }
      .dash { fill: none; stroke: #555; stroke-width: 2.5; stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>

  <text x="800" y="62" text-anchor="middle" class="title">Dual-Rail Power Supply</text>
  <text x="800" y="99" text-anchor="middle" class="subtitle">Simplified JE215 functional path: +15 V, ground, and -15 V</text>

  <rect x="55" y="322" width="170" height="135" class="box"/>
  <text x="140" y="377" text-anchor="middle" class="label">AC input</text>
  <text x="140" y="410" text-anchor="middle" class="small">isolated by T1</text>

  <path d="M225 390 H275" class="line"/>

  <rect x="280" y="300" width="245" height="180" class="box"/>
  <text x="402" y="355" text-anchor="middle" class="label">Transformer T1</text>
  <text x="402" y="392" text-anchor="middle" class="body">12.6 VAC</text>
  <text x="402" y="423" text-anchor="middle" class="body">center-tapped secondary</text>

  <path d="M525 345 H575 V232 H625" class="branch"/>
  <path d="M525 435 H575 V548 H625" class="branch"/>
  <circle cx="575" cy="390" r="7" fill="#222"/>
  <path d="M525 390 H575 V696" class="branch"/>

  <rect x="625" y="177" width="170" height="110" class="box"/>
  <text x="710" y="220" text-anchor="middle" class="label">Rectifier</text>
  <text x="710" y="253" text-anchor="middle" class="body">CR1</text>

  <path d="M795 232 H845" class="line"/>

  <rect x="850" y="177" width="190" height="110" class="box"/>
  <text x="945" y="220" text-anchor="middle" class="label">Filter</text>
  <text x="945" y="253" text-anchor="middle" class="body">C1, 2200 uF</text>

  <path d="M1040 232 H1090" class="line"/>

  <rect x="1095" y="160" width="225" height="144" class="box"/>
  <text x="1208" y="207" text-anchor="middle" class="label">LM317</text>
  <text x="1208" y="240" text-anchor="middle" class="body">positive regulator</text>
  <text x="1208" y="271" text-anchor="middle" class="small">adjustment + protection</text>

  <path d="M1320 232 H1370" class="line"/>

  <rect x="1375" y="177" width="170" height="110" class="output"/>
  <text x="1460" y="225" text-anchor="middle" class="label">+15 V</text>
  <text x="1460" y="258" text-anchor="middle" class="small">positive rail</text>

  <rect x="625" y="493" width="170" height="110" class="box"/>
  <text x="710" y="536" text-anchor="middle" class="label">Rectifier</text>
  <text x="710" y="569" text-anchor="middle" class="body">CR2</text>

  <path d="M795 548 H845" class="line"/>

  <rect x="850" y="493" width="190" height="110" class="box"/>
  <text x="945" y="536" text-anchor="middle" class="label">Filter</text>
  <text x="945" y="569" text-anchor="middle" class="body">C2, 2200 uF</text>

  <path d="M1040 548 H1090" class="line"/>

  <rect x="1095" y="476" width="225" height="144" class="box"/>
  <text x="1208" y="523" text-anchor="middle" class="label">LM337</text>
  <text x="1208" y="556" text-anchor="middle" class="body">negative regulator</text>
  <text x="1208" y="587" text-anchor="middle" class="small">adjustment + protection</text>

  <path d="M1320 548 H1370" class="line"/>

  <rect x="1375" y="493" width="170" height="110" class="output"/>
  <text x="1460" y="541" text-anchor="middle" class="label">-15 V</text>
  <text x="1460" y="574" text-anchor="middle" class="small">negative rail</text>

  <path d="M575 696 H1370" class="branch"/>
  <rect x="1375" y="646" width="170" height="100" class="output"/>
  <text x="1460" y="690" text-anchor="middle" class="label">GND</text>
  <text x="1460" y="721" text-anchor="middle" class="small">center tap</text>

  <rect x="640" y="775" width="905" height="74" class="box"/>
  <text x="1093" y="807" text-anchor="middle" class="label">Analog power distribution: +15 V / GND / -15 V</text>
  <text x="1093" y="836" text-anchor="middle" class="body">ADC-DAC board  |  STM preamplifier  |  piezo drive amplifier</text>

  <text x="55" y="825" class="small">Functional overview only.</text>
  <text x="55" y="851" class="small">Use the original schematic for construction and wiring.</text>
</svg>
